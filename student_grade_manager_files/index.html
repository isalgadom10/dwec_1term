<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Student Grade Manager</h1>
        <p class="subtitle">Manage students and their grades</p>

        <section class="buttons">
            <button id="btnTodas">Show All</button>
            <button id="btnAprobados">Show Passing Students</button>
            <button id="btnMedia">Calculate Average</button>
            <button id="btnNombres">Uppercase Names</button>
        </section>

        <p id="resultado"></p>

        <section id="listaNotas">
            <p class="message">Click a button to display the students.</p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
